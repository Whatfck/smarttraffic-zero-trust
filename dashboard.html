<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>SmartTraffic Dashboard</title>
<style>body{font:16px system-ui;max-width:760px;margin:3rem auto;background:#101827;color:#e5e7eb}section{padding:1rem;border:1px solid #334155;border-radius:8px}#state{font-size:2rem;color:#38bdf8}</style>
</head>
<body><h1>SmartTraffic / Zero Trust</h1><section><p>Estado de la zona norte</p><strong id="state">Conectando...</strong><pre id="payload"></pre></section>
<script>
const state = document.querySelector('#state'), payload = document.querySelector('#payload');
fetch('http://localhost:8080/api/traffic/readings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({zoneId:'north',vehicles:78,averageSpeed:18})})
  .then(r=>r.json()).then(data=>{state.textContent=data.state; payload.textContent=JSON.stringify(data,null,2);})
  .catch(error=>{state.textContent='Servicio no disponible'; payload.textContent=error.message;});
</script></body>
</html>
