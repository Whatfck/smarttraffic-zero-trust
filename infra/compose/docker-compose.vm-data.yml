# =============================================================================
# vm-data (Zona de Datos y Persistencia): Kafka + ZooKeeper, RabbitMQ, PostgreSQL.
#
# network_mode: host -> los contenedores usan la pila de red de la VM, asi el
# firewall nftables de la VM (cadenas input/output) filtra directamente su trafico
# y no hay NAT de Docker que lo esquive.
# =============================================================================
name: smarttraffic
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    network_mode: host
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_CLIENT_PORT_ADDRESS: 127.0.0.1   # solo accesible desde la propia VM
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx192m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 320M
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    network_mode: host
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 127.0.0.1:2181
      # EXTERNAL (9092): unico listener expuesto, exige SASL/OAUTHBEARER (JWT).
      # INTERNAL (29092, solo loopback): trafico del propio broker consigo mismo.
      KAFKA_LISTENERS: "INTERNAL://127.0.0.1:29092,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://127.0.0.1:29092,EXTERNAL://192.168.56.20:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required ;"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
      # Validacion de cada JWT: firma (JWKS de vm-auth), emisor y audiencia.
      KAFKA_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: http://192.168.56.10:8081/.well-known/jwks.json
      KAFKA_SASL_OAUTHBEARER_EXPECTED_ISSUER: http://192.168.56.10:8081
      KAFKA_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: kafka
      KAFKA_CONNECTIONS_MAX_REAUTH_MS: 300000   # obliga a re-presentar un JWT vigente
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 900M
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-alpine
    network_mode: host
    hostname: vm-data
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/20-smarttraffic.conf:/etc/rabbitmq/conf.d/20-smarttraffic.conf:ro
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  postgres-db:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_DB: smarttraffic
      POSTGRES_USER: smarttraffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data   # named volume persistente
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  rabbitmq-data:
  postgres-data:
