## RabbitMQ en vm-data: SOLO se aceptan conexiones autenticadas con JWT.
## No hay usuarios internos (sin guest, sin contrasenas): el unico backend de
## autenticacion/autorizacion es el plugin OAuth2.
auth_backends.1 = rabbit_auth_backend_oauth2

## El JWT debe traer aud = "rabbitmq"; los permisos se leen de los scopes
## rabbitmq.<configure|read|write>:<vhost>/<recurso>
auth_oauth2.resource_server_id = rabbitmq
auth_oauth2.preferred_username_claims.1 = sub

## Clave publica de la Autoridad (vm-auth) para verificar la firma RS256.
auth_oauth2.jwks_url = http://192.168.56.10:8081/.well-known/jwks.json

default_vhost = smarttraffic
loopback_users = none
listeners.tcp.default = 5672
